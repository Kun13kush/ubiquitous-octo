name: Deploy application
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, production]
        default: development
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment || 'development' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'development' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: pip install bandit==1.8.6 && bandit -r app -s B104
      - name: Build and scan before acquiring AWS credentials
        run: |
          docker build --build-arg APP_VERSION="${{ github.sha }}" -t finzla:release .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:0.70.0@sha256:85e87be1a96459c38a4eea47dc64eb2d342bb14cd4b4cef96adcf6ff03378b7c image --no-progress --scanners vuln --exit-code 1 --severity HIGH,CRITICAL finzla:release
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: finzla-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Push immutable image, deploy, verify release, roll back on failure
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          BASE_URL: ${{ vars.BASE_URL }}
          RELEASE: ${{ github.sha }}
        run: bash scripts/deploy.sh
